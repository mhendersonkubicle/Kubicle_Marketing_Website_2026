# Static site with a pre-render build step. `npm run build` renders the
# shared nav and footer into each HTML page (see build.js); Netlify deploys
# the resulting /dist folder. The build script also generates
# /dist/sitemap.xml from the rendered HTML so the sitemap can never drift
# from what actually ships.

[build]
  publish = "dist"
  command = "npm run build"

# Deploy-preview + branch-deploy contexts share the same build settings.
# Pointing preview robots.txt at a no-index version would be nice if Netlify
# ever exposes preview-only assets — for now, deploy previews are protected
# by Netlify's default password-protect option if configured.

# ============================================================
# Security headers (apply to every response)
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Anti-clickjacking
    X-Frame-Options = "SAMEORIGIN"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer policy: send origin on cross-origin to support analytics
    # without leaking full URLs
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions Policy: deny features we don't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # HSTS: enforce HTTPS for the apex + all subdomains for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Cross-Origin policies — moderate, to allow Fontshare / Hubspot embeds
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# ============================================================
# Caching policies
# ============================================================

# HTML — short cache so content edits propagate quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS / JS — versioned by file content; one year is safe because the
# fingerprinted paths (e.g. /img/posts/<hash>_name.jpg) change on update.
# Non-fingerprinted shared assets are short enough to refresh in days.
[[headers]]
  for = "/shared/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/blog/blog.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/blog/blog.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Images — long cache; filenames are hash-prefixed so changes get new URLs
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/blog/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/courses/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/academies/*/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts (if served locally — we currently use Fontshare CDN, but cover
# the case where local woff2 fonts are added under /academies/*/fonts/)
[[headers]]
  for = "/academies/*/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap + robots — short cache so SEO updates propagate same day
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Case study PDFs — long cache (filenames are content-hashed)
[[headers]]
  for = "/Case_Study_pdfs/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    Content-Type = "application/pdf"

# Direct-download assets (ungated catalog PDF). noindex so the ungated
# file never outranks the gated /catalog page.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    Content-Type = "application/pdf"
    X-Robots-Tag = "noindex"
